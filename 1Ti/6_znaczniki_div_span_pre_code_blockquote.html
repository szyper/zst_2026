<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Znaczniki div, span, pre, code i blockquote</title>
</head>
<body>
    <p>To jest zwykły tekst
        <span>ten fragment znajduje się w znaczniku span</span>
    </p>

    <div>
        <h2>Przykład kodu</h2>
        <p>Znacznik <code>&lt;p&gt;</code> służy do tworzenia akapitu</p>
    

        <pre><code>
                function hello(){
                    console.log("ZST");
                }
            </code>
        </pre>
    </div>

    <div>
        <h2>Cytat</h2>
        <blockquote>
            Nauka HTML to pierwszy krok do tworzenia stron internetowych
        </blockquote>
    </div>
</body>
</html>
