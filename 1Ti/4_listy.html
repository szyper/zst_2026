<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listy 1</title>
</head>
<body>
    <h4>Listy</h4>

    <ul>
        <li>Polska</li>
        <li>Niemcy</li>
        <li>Rosja</li>
    </ul>

    <ul style="list-style-type: square;">
        <li>Polska</li>
        <li>Niemcy</li>
        <li>Rosja</li>
    </ul>

    
    <ul style="list-style-type: circle;">
        <li>Polska</li>
        <li>Niemcy</li>
        <li>Rosja</li>
    </ul>

    
    <ul style="list-style-type: disc;">
        <li>Polska</li>
        <li>Niemcy</li>
        <li>Rosja</li>
    </ul>
</body>
</html>
