<!-- informuje przeglądarkę, że dokument jest napisany w HTML5 -->
<!DOCTYPE html>
<!-- poaczątek dokumentu HTML. lang="pl" oznacza, że językiem strony jest polski-->
<html lang="pl">
<!-- sekcja HEAD zawiera informacje o stronie, które nie są bezpośrednio wyświetlane na stronie -->
<head>
    <!-- określa sposób kodowania znaków. UTF-8 pozwala poprawnie wyświetlać np. ą, ę, ł, ó, ż, ź, ń, ś -->
    <meta charset="UTF-8">
    <!-- ustawienia wyświetlania na różnych urządzeniach.
    width=device-width szerokość strony dopasowana do ekranu urządzenia  
    initial-scale=1.0 początkowe powiększenie = 100% -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tytuł strony widoczny np. na karcie przeglądarki -->
    <title>ZST</title>
    <!-- koniec seksji HEAD -->
</head>
<!-- tutaj znajduje się właściwa zawartość strony, czyli elementy widoczne dla użytkownika -->
<body>
    

<!-- koniec zawartości strony -->
</body>
<!-- koniec całego dokumentu HTML -->
</html>
