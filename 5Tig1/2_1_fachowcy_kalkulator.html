<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<title>Kalkulator remontu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #555;
    }

    .back {
      background-color: #555;
    }

    .hidden {
      display: none;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 5px;
      font-size: 16px;
    }

    .checkbox {
      margin-top: 20px;
    }

    .checkbox input {
      margin-right: 8px;
    }

    .section {
      border-top: 1px solid #ddd;
      margin-top: 25px;
      padding-top: 15px;
    }

    .result {
      background-color: #f0f0f0;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
      line-height: 1.8;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
    }

    .hint {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Strona główna -->
  <div id="home" class="card">
    <h1>Kalkulator remontu</h1>
    <p style="text-align: center">
      Wybierz rodzaj prac, które chcesz wykonywać
    </p>
    <div class="menu">
      <button onclick="showPage('tiles')">🧱 Płytki</button>
      <button onclick="showPage('paint')">🎨 Malowanie</button>
    </div>
  </div>

  <!-- Płytki -->
  <div id="tiles" class="card hidden">

    <h2>🧱 Kalkulator płytek</h2>

    <h3>📐 Powierzchnia podłogi [m²]</h3>

    <labe for="floorArea"></labe>
    <input type="number" id="floorArea" min="0" step="0.01" placeholder="np. 20">

<!--  ściany  -->
    <div class="section">
      <h3>🧱 Powierzchnia ścian</h3>
      <label class="checkbox">
        <input type="checkbox" id="walls" onchange="toggleWalls()">
        Chcę układać płytki również na ścianach
      </label>

      <div id="wallFields" class="hidden">
        <label for="perimeter">Obwód pomieszczenia [m]</label>
        <input type="number" id="perimeter" min="0" step="0.01" placeholder="np. 25">

        <label for="wallHeight">Wysokość układania płytek na ścianie [m]</label>
        <input type="number" id="wallHeight" min="0" step="0.01" placeholder="np. 2.5">
      </div>


    </div>

<!--  Drzwi  -->
    <div class="section">
      <h3>🚪Odliczanie drzwi</h3>

      <label class="checkbox">
        <input type="checkbox" id="doors" onchange="toggleDoors()">
        Odlicz drzwi od powierzchni ścian
      </label>

      <div id="doorFields" class="hidden">
        <label for="doorWidth">Szerokość drzwi (m)</label>
        <input type="number" id="doorWidth" min="0" step="0.01" placeholder="np. 0.9">

        <label for="doorHeight">Wysokość drzwi (m)</label>
        <input type="number" id="doorHeight" min="0" step="0.01" placeholder="np. 2">
      </div>
    </div>

    <!--  Okna  -->
    <div class="section">
      <h3>🪟 Odliczanie okien</h3>

      <label class="checkbox">
        <input type="checkbox" id="windows" onchange="toggleWindows()">
        Odlicz okna od powierzchni ścian
      </label>

      <div id="windowFields" class="hidden">
        <label for="windowWidth">Szerokość okna (m)</label>
        <input type="number" id="windowWidth" min="0" step="0.01" placeholder="np. 0.9">

        <label for="windowHeight">Wysokość okna (m)</label>
        <input type="number" id="windowHeight" min="0" step="0.01" placeholder="np. 2">
      </div>
    </div>

<!--  płytki  -->
    <label for="tileLength">Długość płytki [cm]</label>
    <input type="number" id="tileLength" min="1" step="0.1" placeholder="np. 60">

    <label for="tileWidth">Szerokość płytki [cm]</label>
    <input type="number" id="tileWidth" min="1" step="0.1" placeholder="np. 60">

<!--  opakowanie  -->
    <label for="packageArea">
      📦 Powierzchnia jednego opakowania
    </label>
    <input type="number" id="packageArea" min="0" step="1" placeholder="np. 2">

    <div class="hint">Informację znajdziesz na opakowaniu płytek</div>

    <label for="tilePrice">
      💰 Cena płytek za 1 m² (zł):
    </label>
    <input type="number" id="tilePrice" min="0" step="0.01" placeholder="np. 100.55">

<!-- Zapas -->
    <div class="section">
      <h3>➕ Zapas i docinki</h3>
      <label for="waste">Zapas na docinki i odpady (%)</label>
      <input type="number" id="waste" min="0" step="1" value="10">
      <div class="hint">Domyślnie przyjęto 10% zapasu</div>
    </div>

<!-- Robocizna -->
    <div class="secttion">
      <h3>👷‍♂️ Robocizna</h3>
      <label for="layingPrice">
        Cena układania płytek za 1m²
      </label>
      <input type="number" id="layingPrice" min="0" step="0.01" value="100">
    </div>

<!-- Klej -->
<!--  dokończyć  -->
    <button onclick="calculateTiles()">Oblicz koszt układania płytek</button>

    <div id="tileResult" class="result hidden"></div>
  </div>

  <!-- Malowanie -->
  <section id="paint" class="card hidden"></section>

</div>

<script>
  // ceny za 1m²
  const TILE_LAYING_PRICE = 100;
  const PAINTING_PRICE = 15;

  function showPage(page) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("tiles").classList.add("hidden");
    document.getElementById("paint").classList.add("hidden");

    document.getElementById(page).classList.remove("hidden");
  }

  function toggleWalls() {
    const checked = document.getElementById("walls").checked;

    document.getElementById("wallFields").classList.toggle("hidden", !checked);
  }

  function calculateTiles() {
    const floorArea = parseFloat(document.getElementById("floorArea").value);
    const tileLength = parseFloat(document.getElementById("tileLength").value);
    const tileWidth = parseFloat(document.getElementById("tileWidth").value);

    const waste = parseFloat(document.getElementById("waste").value || 0);

    const walls = document.getElementById("walls").checked;

    if (!floorArea || floorArea <= 0 || !tileLength || tileLength <= 0 || !tileWidth || tileWidth <= 0) {
      alert("Uzupełnij poprawnie dane dotyczące podłogi i wymiarów płytki");
      return;
    }

    let wallArea = 0;

    if (walls) {
      const perimeter = parseFloat(document.getElementById("perimeter").value);
      const wallHeight = parseFloat(document.getElementById("wallHeight").value);

      if (!perimeter || perimeter <= 0 || !wallHeight || wallHeight <= 0) {
        alert("Podaj obwód pomieszczenia oraz wysokość układania płytek na ścianach");
        return;
      }

      wallArea = perimeter * wallHeight;
    }

    const totalArea = floorArea + wallArea;

    const tileArea = (tileLength / 100) * (tileWidth / 100);

    const tilesWithoutWaste = totalArea / tileArea;

    const tilesToBuy = Math.ceil(tilesWithoutWaste * (1 + waste / 100));

    const layingCost = totalArea * TILE_LAYING_PRICE;

    const result = document.getElementById("tileResult");

    result.classList.remove("hidden");

    result.innerHTML = `
      <strong>Wynik:</strong><br>

      Powierzchnia podłogi:
      <b>${floorArea.toFixed(2)} m²</b><br>

      Powierzchnia ścian:
      <b>${wallArea.toFixed(2)} m²</b><br>

      Łączna powierzchnia:
      <b>${totalArea.toFixed(2)} m²</b><br>

      Powierzchnia jednej płytki:
      <b>${tileArea.toFixed(2)} m²</b><br>

      Płytki bez zapasu:
      <b>${Math.ceil(tilesWithoutWaste)} szt.</b><br>

      Zapas:
      <b>${waste}%</b><br>

      <strong>Do kupienia</strong>
      <strong>${tilesToBuy} szt.</strong><br>

      Cena położenia:
      <span class="price">${layingCost.toFixed(2)} zł</span>
    `;
  }

</script>

</body>
</html>
