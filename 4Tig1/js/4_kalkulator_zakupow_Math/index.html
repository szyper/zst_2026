<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator zakupów</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Kalkulator zakupów</h1>

    <form id="shoppingForm">
        <label for="price">Cena zakupu (zł):</label>
        <input type="number" id="price" step="0.01" min="0.01" required><br><br>

        <label for="quantity">Liczba sztuk:</label>
        <input type="number" id="quantity" step="1" min="1" required><br><br>

        <label for="discount">Rabat (%):</label>
        <input type="number" id="discount" min="0" max="100" value="0" required><br><br>

        <button type="submit">Oblicz koszt zakupów</button>
    </form>

    <div id="result">

    </div>

    <script>
        document.getElementById("shoppingForm").addEventListener("submit", function(event){
            
            event.preventDefault();
            
            // pobieranie danych z formularza
            let priceText = document.getElementById("price").value;
            let quantityText = document.getElementById("quantity").value;
            let discountText = document.getElementById("discount").value;

            // alert(priceText + quantityText);

            // konwersja tekstu na liczby
            let price = Number(priceText);
            let quantity = Number(quantityText);
            let discount = Number(discountText);

            // alert(price + quantity);

            // sprawdzenie poprawności danych
            if (priceText === "" || quantityText === "" || discountText === "" || isNaN(price) || price <= 0 || isNaN(quantity) || quantity <= 0 || isNaN(discount) || discount < 0 || discount > 100 || !Number.isInteger(quantity)) {
                document.getElementById("result").textContent = "Wprowadź poprawne dane!";
                return;
            }

            // obliczenia
            let total = price * quantity;
            let discountAmount = total * discount / 100; // kwota rabatu
            let finalPrice = total - discountAmount;
            
            // zaokrąglenia
            // 59.876 Math.round(finalPrice) => 60
            //finalPrice.toFixed(2) => wynik jest tekstem (string)

            finalPrice = Math.round(finalPrice * 100) / 100;
            let roundedUp = Math.ceil(finalPrice);
            let roundedDown = Math.floor(finalPrice);

            // wyświetlenie wyniku
            document.getElementById("result").innerHTML = `
                <h2>Podsumowanie zakupów</h2>
                <p>Koszt przed rabatem: ${total.toFixed(2)} zł</p>
                <p>Kwota rabatu: ${discountAmount.toFixed(2)} zł</p>
                <p>Do zapłaty: ${finalPrice.toFixed(2)} zł</p>
                <p>Zaokrąglenie w górę: ${roundedUp} zł</p>
                <p>Zaokrąglenie w dół: ${roundedDown} zł</p>

            `;

        });
    </script>
</body>
</html>
