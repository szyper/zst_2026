<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<title>Kalkulator remontu</title>
	<style>
      * { box-sizing: border-box }

      body {
		      margin: 0;
		      font-family: Arial, sans-serif;
		      background: #f3f4f6;
		      color: #222;
      }

      .container {
		      width: min(760px, 92%);
		      margin: 40px auto;
      }

      .card {
		      background: white;
		      border-radius: 14px;
		      padding: 30px;
		      box-shadow: 0 8px 25px rgba(0, 0, 0, .10);
      }

      h1, h2 {
		      margin-top: 0;
      }

      h1 {
		      text-align: center;
      }

      .menu {
		      display: grid;
		      grid-template-columns: 1fr 1fr;
		      gap: 18px;
		      margin-top: 30px;
      }

      button {
		      border: 0;
		      border-radius: 10px;
		      padding: 14px 18px;
		      font-size: 16px;
		      cursor: pointer;
		      background: #2563eb;
		      color: white;
      }

      button:hover {
		      opacity: .9;
      }

      .secondary {
		      background: #6b7280;
      }

      .back {
		      margin-bottom: 20px;
      }

      .hidden {
		      display: none;
      }

      label {
		      display: block;
		      margin-top: 15px;
		      font-weight: bold;
      }

      input[type="number"] {
		      width: 100%;
		      padding: 11px;
		      margin-top: 6px;
		      border: 1px solid #ccc;
		      border-radius: 8px;
		      font-size: 16px;
      }

      .checkbox {
		      display: flex;
		      align-items: center;
		      gap: 10px;
		      margin-top: 18px;
		      font-weight: bold;
      }

      .checkbox input {
		      width: 18px;
		      height: 18px;
      }

      .result {
		      margin-top: 25px;
		      padding: 18px;
		      border-radius: 10px;
		      background: #eef6ff;
		      border-left: 5px solid #2563eb;
		      line-height: 1.7;
      }

      .result strong {
		      font-size: 18px;
      }

      .hint {
		      color: #666;
		      font-size: 14px;
		      margin-top: 5px;
      }

      .price {
		      font-size: 24px;
		      font-weight: bold;
      }
	</style>
</head>
<body>
	<div class="container">
		<!--	strona główna	-->
		<div id="home" class="card">
			<h1>Kalkulator remontu</h1>
			<p style="text-align: center">
				Wybierz rodzaj prac, które chcesz wykonać:
			</p>
			<div class="menu">
				<button onclick="showPage('tiles')">🧱 Płytki</button>
				<button onclick="showPage('paint')">🎨 Malowanie</button>
			</div>
		</div>

		<!--	Płytki	-->
		<div id="tiles" class="card hidden">

			<h2>🧱 Kalkulator płytek</h2>

			<h3>📐 Powierzchnia podłogi [m²]</h3>

			<label for="floorArea">Powierzchnia podłogi</label>
			<input type="number" id="floorArea" min="0" step="0.01" placeholder="np. 20">
<!-- ściany -->
			<div class="section">
				<h3>🧱 Powierzchnia ścian</h3>
				<label class="checkbox">
					<input type="checkbox" id="walls" onchange="toggleWalls()">
					Chcę ukłądać płytki również na ścianach
				</label>

				<div id="wallFields" class="hidden">
					<label for="perimeter">Obwód pomieszczenia [m]</label>
					<input type="number" id="perimeter" min="0" step="0.01" placeholder="np. 18">

					<label for="wallHeight">Wysokość układania płytek na ścianie [m]</label>
					<input type="number" id="wallHeight" min="0" step="0.01" placeholder="np. 2.55">
				</div>
			</div>

<!-- Drzwi -->
			<div class="section">
				<h3>Odliczanie drzwi</h3>
				<label class="checkbox">
				<input type="checkbox" id="doors" onchange="toggleDoors()">
					Odlicz drzwi od powierzchni ścian
				</label>

				<div class="doorFields" class="hidden">
					<label for="doorWidth">Szerokość drzwi (m)</label>
					<input type="number" id="doorWidth" min="0" step="0.01" placeholder="np. 0.9">

					<label for="doorHeight">Wysokość drzwi (m)</label>
					<input type="number" id="doorHeight" min="0" step="0.01" placeholder="np. 2">
				</div>
			</div>

<!-- Okna -->
			<div class="section">
				<h3>🪟 Odliczanie okien drzwi</h3>

				<label class="checkbox">
				<input type="checkbox" id="windows" onchange="toggleWindows()">
					Odlicz okna od powierzchni ścian
				</label>

				<div class="windowFields" class="hidden">
					<label for="windowsWidth">Szerokość okna (m)</label>
					<input type="number" id="windowsWidth" min="0" step="0.01" placeholder="np. 0.9">

					<label for="windowHeight">Wysokość okna (m)</label>
					<input type="number" id="windowHeight" min="0" step="0.01" placeholder="np. 2">
				</div>
			</div>

<!-- Płytki -->

			<label for="tileLength">Długość płytki [cm]</label>
			<input type="number" id="tileLength" min="0" step="0.1" placeholder="np. 60">

			<label for="tileWidth">Szerokość podłogi [m²]</label>
			<input type="number" id="tileWidth" min="0" step="0.01" placeholder="np. 60">

<!-- opakowanie -->
			<label for="packageArea">
				📦 Powierzchnia jednego opakowania
			</label>
			<input type="number" id="packageArea" min="0" step="0.01" placeholder="np. 2">



			<label for="waste">Zapas płytek [%]</label>
			<input type="number" id="waste" min="0" step="1" placeholder="np. 10">
			<div class="hint">Domyślnie przyjęto 10% zapasu</div>



			<br>
			<button onclick="calculateTiles()">Oblicz koszt położenia płytek</button>

			<div id="tileResult" class="result hidden"></div>
		</div>

		<!--	Malowanie	-->
		<section id="paint" class="card hidden">

		</section>
		<!--	dokończyć	-->
	</div>
	<script>
	<!--	ceny za 1 m²	-->
	const TILE_LAYING_PRICE = 100;
  const PAINTING_PRICE = 15;

  function showPage(page){
		document.getElementById("home").classList.add("hidden");
		document.getElementById("tiles").classList.add("hidden");
		document.getElementById("paint").classList.add("hidden");
		//
		document.getElementById(page).classList.remove("hidden");
  }

  // pokazywanie i ukrywanie pól dotyczących ścian
  function toggleWalls() {
		// sprawdzamy czy chceckbox jest zaznaczony
		  const checked = document.getElementById("walls").checked;

      document.getElementById("wallFields").classList.toggle("hidden", !checked);
  }

	// kalkulator płytek
	function calculateTiles(){
      const floorArea = parseFloat(document.getElementById("floorArea").value);
      const tileLength = parseFloat(document.getElementById("tileLength").value);
      const tileWidth = parseFloat(document.getElementById("tileWidth").value);

      const waste = parseFloat(document.getElementById("waste").value || 0);

      const walls = document.getElementById("walls").checked;

      if (!floorArea || floorArea <= 0 ||
		      !tileLength || tileLength <= 0 ||
		      !tileWidth || tileWidth <= 0 ||
		      waste < 0){
          alert("Uzupełnij poprawnie dane dotyczące podłogi i wymiaró płytki");
          return;
      }

      let wallArea = 0;

      // jeżeli zaznaczymy ściany
			if (walls) {
          // pobieramy obwód pomieszczenia
					const perimeter = parseFloat(document.getElementById("perimeter").value);

          // pobieramy wysokość płytek na ścianie
          const wallHeight = parseFloat(document.getElementById("wallHeight").value);


          if (!perimeter  || perimeter <= 0 ||
              !wallHeight || wallHeight <= 0) {
              alert("Podaj obwód pomieszczenia oraz wysokość układania płytek na ścianach");
              return;
          }

          // powierzchnia ścian = obwód * wysokość
					wallArea = perimeter * wallHeight;
			}

      // powierzchnia podłogi + powierzchnia ścian
			const totalArea = floorArea + wallArea;

      // zamiana centymetrów na metry i obliczenie powierzchni jednej płytki
			const tileArea = (tileLength / 100) * (tileWidth / 100);

      // liczba płytek bez zapasu
			const tilesWithoutWaste = totalArea / tileArea;

      // liczba płytek z zapasem
			const tilesToBuy = Math.ceil(tilesWithoutWaste * (1 + waste / 100));

      // cena położenia płytek
			// zapas NIE jest tutaj uwzględniany
			const layingCost = totalArea * TILE_LAYING_PRICE;

      // pobieramy element, w którym pokażemy wynik
			const result = document.getElementById("tileResult");

      result.classList.remove("hidden");

      // wyświetlenie wyniku
			result.innerHTML = `
				<strong>Wynik:</strong><br>

				Powierzchnia podłogi:
				<b>${floorArea.toFixed(2)} m²</b><br>

				Powierzchnia ścian:
				<b>${wallArea.toFixed(2)} m²</b><br>

				Łączna powierzchnia:
				<b>${totalArea.toFixed(2)} m²</b><br>

				Powierzchnia jednej płytki:
				<b>${tileArea.toFixed(2)} m²</b><br>

				Płytki bez zapasu:
				<b>${Math.ceil(tilesWithoutWaste)} szt.</b><br>

				Zapas:
				<b>${waste}%</b><br>

				<strong>Do kupienia
				${tilesToBuy} szt.</strong><br><br>

				Cena położenia:
				<span class="price">${layingCost.toFixed(2)} zł</span>
			`;
	}

	</script>
</body>
</html>
